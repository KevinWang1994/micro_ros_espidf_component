name: Build static library for ESP32

on:
  workflow_dispatch:
    inputs:
      idf_version:
        description: 'ESP-IDF version (e.g., v5.3)'
        required: true
        default: 'v5.3'
      platform:
        description: 'Target platform'
        required: true
        default: 'esp32'
        type: choice
        options:
        - esp32
        - esp32s2
        - esp32s3
        - esp32c3

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget bzip2 tar

      - name: Build static library
        run: |
          cd docker
          ./build.sh ${{ github.event.inputs.platform }} ${{ github.event.inputs.idf_version }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: micro_ros_${{ github.event.inputs.platform }}_idf${{ github.event.inputs.idf_version }}_artifact
          path: output/
